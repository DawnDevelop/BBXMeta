<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moved to beydle.com/meta</title>
    <!-- GitHub Pages cannot send a 301, so an immediate refresh plus a canonical link tells search engines the page moved. -->
    <link rel="canonical" href="https://beydle.com/meta" />
    <meta http-equiv="refresh" content="0; url=https://beydle.com/meta" />
    <script>location.replace("https://beydle.com/meta");</script>
</head>

<body>
    <p>The Beyblade X meta leaderboard has moved to <a href="https://beydle.com/meta">beydle.com/meta</a>.</p>
</body>

</html>
